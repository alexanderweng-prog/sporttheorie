<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sporttheorie 7. Klasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 /* Aufbau: Kopfband, zwei Kapitelraster (45 und 90 Minuten), Einheit als Aufgabenliste */
 --bg:#eef1f5;--panel:#ffffff;--ink:#0f1b2d;--muted:#475569;--line:#0f1b2d;--soft:#e2e8f0;
 --accent:#ff5a1f;--on-accent:#0f1b2d;--c45:#0a7a6e;--c90:#4338ca;
 --ok:#14804a;--okbg:#e3f5ea;--bad:#b42318;--badbg:#fde8e6;
 --fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0c1420;--panel:#152133;--ink:#e8eef7;--muted:#a3b1c6;--line:#5b6f8c;--soft:#22324a;
 --accent:#ff7a45;--on-accent:#0c1420;--c45:#3ccbb9;--c90:#a5a8ff;
 --ok:#4ade80;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1815;color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0c1420;--panel:#152133;--ink:#e8eef7;--muted:#a3b1c6;--line:#5b6f8c;--soft:#22324a;
 --accent:#ff7a45;--on-accent:#0c1420;--c45:#3ccbb9;--c90:#a5a8ff;
 --ok:#4ade80;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1815;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--fd);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,7vw,54px)}
h2{font-size:28px}
h3{font-size:22px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:#060b13;color:#e8eef7}}
:root[data-theme="dark"] nav{background:#060b13;color:#e8eef7}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
nav a{text-decoration:none;font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.03em}
nav .r{display:flex;align-items:center;gap:14px;font-weight:600;font-size:15px}
nav .pill{background:var(--accent);color:var(--on-accent);padding:4px 12px;border:0;border-radius:99px;font-weight:600}
main{padding:24px 0 72px}
.hero{display:grid;gap:18px;margin-bottom:28px}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:0;margin:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;background:var(--panel);border:2px solid var(--line);padding:12px 14px;border-radius:10px}
.how li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:50%}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:4px 4px 0 var(--line)}
.sum{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.big{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;font-weight:700;color:var(--muted)}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.m45 .bar i,.card.m45 .bar i{background:var(--c45)}
.m90 .bar i,.card.m90 .bar i{background:var(--c90)}
.nameline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.nameline input{flex:1 1 200px;min-width:0;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:2px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{margin-top:34px}
.sec>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.sec>header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;border-top-width:8px}
.card.m45{border-top-color:var(--c45)}
.card.m90{border-top-color:var(--c90)}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--line)}
.card .n{font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card h3{min-height:2.1em}
.card .st{display:flex;justify-content:space-between;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap}
.tag.done{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.back{display:inline-block;margin-bottom:14px;font-weight:600}
.uh{border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;border-left-width:10px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--line)}
.uh.m45{border-left-color:var(--c45)}
.uh.m90{border-left-color:var(--c90)}
.badge{justify-self:start;font-weight:700;font-size:14px;padding:3px 12px;color:#fff;border-radius:99px;background:var(--c45)}
.m90 .badge{background:var(--c90)}
:root[data-theme="dark"] .badge,:root[data-theme="dark"] .m90 .badge{color:#0c1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#0c1420}}
.lead{margin:0;max-width:65ch}
.merke{margin-top:18px;background:var(--soft);border-radius:12px;padding:16px 18px}
.merke h2{margin-bottom:8px}
.merke ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:70ch}
.tasks{display:grid;gap:16px;margin-top:20px}
.task{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;scroll-margin-top:70px}
.task.done{border-color:var(--ok)}
.th{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.th b{font-family:var(--fd);font-size:24px;font-weight:800}
.q{margin:0;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--soft);border-radius:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--line);background:var(--bg)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt input,.tfg input{accent-color:var(--accent);width:18px;height:18px;margin-top:3px;flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:9px 12px;border:2px solid var(--soft);border-radius:8px}
.row.bad{border-color:var(--bad);background:var(--badbg)}
.rt{flex:1 1 240px}
.tfg{display:flex;gap:14px}
.tfg label{display:flex;gap:6px;align-items:center;cursor:pointer}
select,.gap,textarea{border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;max-width:100%}
select{flex:0 1 300px;min-width:180px}
.cloze{margin:0;line-height:2.4}
.gap{width:150px;margin:0 4px;padding:4px 8px}
.gap.bad{border-color:var(--bad);background:var(--badbg)}
textarea{width:100%;resize:vertical;min-height:110px}
.count{font-size:14px;color:var(--muted)}
.fb{padding:9px 12px;border-radius:8px;font-weight:600}
.fb.good{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.muster{background:var(--soft);padding:12px 14px;border-radius:8px}
.muster p{margin:4px 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.check{margin-top:24px}
.check .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin-top:10px}
th,td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--soft);white-space:nowrap}
th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.t{white-space:normal}
#nachtext{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
details{border:2px solid var(--soft);border-radius:8px;padding:8px 12px;margin-top:8px}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0;white-space:pre-wrap}
.stack{display:grid;gap:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){body{font-size:16px}.big{font-size:38px}}
.xh{margin-top:14px;display:grid;gap:4px}
.xs{margin:0;color:var(--muted)}
.links{margin-top:18px;display:grid;gap:8px}
.links ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.links a{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:10px;color:inherit;text-decoration:none;min-width:0}
.links a:hover,.links a:focus-visible{border-color:var(--ink)}
.links b{overflow-wrap:anywhere}
.links small{grid-column:2;color:var(--muted)}
.lk{grid-row:1/3;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ink);color:var(--bg)}
.mem{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.mcd{min-height:84px;padding:8px 10px;border:2px solid var(--line);border-radius:10px;background:var(--ink);color:var(--bg);font-family:var(--fd);font-size:30px;font-weight:800;cursor:pointer;display:grid;place-items:center;text-align:center}
.mcd.up{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;font-weight:600;line-height:1.25}
.mcd.hit{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.mcd[disabled]{cursor:default;opacity:1}
.cw{display:grid;gap:14px}
.cwg{--cs:max(28px,min(38px,calc((100vw - 90px)/var(--cols) - 2px)));display:grid;gap:2px;overflow-x:auto;padding-bottom:4px;justify-content:start}
.cwb{width:var(--cs);height:var(--cs)}
.cwc{position:relative;width:var(--cs);height:var(--cs)}
.cwc i{position:absolute;top:1px;left:3px;font-size:10px;font-style:normal;font-weight:700;color:var(--muted);pointer-events:none;line-height:1}
.cwi{width:100%;height:100%;padding:8px 0 0;text-align:center;font-weight:700;font-size:calc(var(--cs)*.5);text-transform:uppercase;border:2px solid var(--line);border-radius:4px;background:var(--panel);caret-color:var(--accent)}
.cwc.bad .cwi{border-color:var(--bad);background:var(--badbg)}
.cwc.ok .cwi{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.cwl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr));gap:12px}
.task>*,.cw>*{min-width:0}
.cwl h4{margin:0 0 4px;font-family:var(--fd);font-size:20px}
.cwl ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:15px}
.cwl li b{display:inline-block;min-width:1.6em}
.cwl .n{color:var(--muted)}
.so{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.so .row{justify-content:flex-start;flex-wrap:nowrap}
.so .sn{font-family:var(--fd);font-weight:800;font-size:22px;min-width:1.4em;color:var(--muted)}
.so .rt{flex:1 1 auto}
.mvb{display:flex;gap:6px;margin-left:auto}
.btn.sm{padding:4px 12px;min-width:44px}
</style>
</head>
<body>
<nav><div class="wrap"><a href="#start">Sporttheorie 7</a><div class="r"><span id="navprog"></span><a class="pill" href="#nachweis">Nachweis</a></div></div></nav>
<main><div class="wrap" id="app"></div></main>
<script>
