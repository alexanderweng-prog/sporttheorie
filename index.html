<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sporttheorie 7. Klasse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 /* Aufbau: Kopfband, zwei Kapitelraster (45 und 90 Minuten), Einheit als Aufgabenliste */
 --bg:#eef1f5;--panel:#ffffff;--ink:#0f1b2d;--muted:#475569;--line:#0f1b2d;--soft:#e2e8f0;
 --accent:#ff5a1f;--on-accent:#0f1b2d;--c45:#0a7a6e;--c90:#4338ca;
 --ok:#14804a;--okbg:#e3f5ea;--bad:#b42318;--badbg:#fde8e6;
 --fd:'Barlow Condensed','Arial Narrow',sans-serif;--fb:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
 color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0c1420;--panel:#152133;--ink:#e8eef7;--muted:#a3b1c6;--line:#5b6f8c;--soft:#22324a;
 --accent:#ff7a45;--on-accent:#0c1420;--c45:#3ccbb9;--c90:#a5a8ff;
 --ok:#4ade80;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1815;color-scheme:dark;}}
:root[data-theme="dark"]{
 --bg:#0c1420;--panel:#152133;--ink:#e8eef7;--muted:#a3b1c6;--line:#5b6f8c;--soft:#22324a;
 --accent:#ff7a45;--on-accent:#0c1420;--c45:#3ccbb9;--c90:#a5a8ff;
 --ok:#4ade80;--okbg:#12301f;--bad:#ff8a80;--badbg:#3a1815;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--fd);font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(34px,7vw,54px)}
h2{font-size:28px}
h3{font-size:22px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
nav{position:sticky;top:0;z-index:5;background:var(--ink);color:var(--bg)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav{background:#060b13;color:#e8eef7}}
:root[data-theme="dark"] nav{background:#060b13;color:#e8eef7}
nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
nav a{text-decoration:none;font-family:var(--fd);font-weight:800;font-size:22px;letter-spacing:.03em}
nav .r{display:flex;align-items:center;gap:14px;font-weight:600;font-size:15px}
nav .pill{background:var(--accent);color:var(--on-accent);padding:4px 12px;border:0;border-radius:99px;font-weight:600}
main{padding:24px 0 72px}
.hero{display:grid;gap:18px;margin-bottom:28px}
.eyebrow{font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:13px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;padding:0;margin:0;list-style:none;counter-reset:s}
.how li{counter-increment:s;background:var(--panel);border:2px solid var(--line);padding:12px 14px;border-radius:10px}
.how li::before{content:counter(s);display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:50%}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:4px 4px 0 var(--line)}
.sum{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between}
.big{font-family:var(--fd);font-weight:800;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;font-weight:700;color:var(--muted)}
.bar{height:12px;background:var(--soft);border-radius:99px;overflow:hidden;border:1.5px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.m45 .bar i,.card.m45 .bar i{background:var(--c45)}
.m90 .bar i,.card.m90 .bar i{background:var(--c90)}
.nameline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.nameline input{flex:1 1 200px;min-width:0;padding:9px 12px;border:2px solid var(--line);border-radius:8px;background:var(--bg)}
.btn{display:inline-block;background:var(--accent);color:var(--on-accent);border:2px solid var(--line);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.sec{margin-top:34px}
.sec>header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.sec>header p{margin:0;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px 16px;border-top-width:8px}
.card.m45{border-top-color:var(--c45)}
.card.m90{border-top-color:var(--c90)}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--line)}
.card .n{font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.card h3{min-height:2.1em}
.card .st{display:flex;justify-content:space-between;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tag{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1.5px solid var(--line);white-space:nowrap}
.tag.done{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.back{display:inline-block;margin-bottom:14px;font-weight:600}
.uh{border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:18px;border-left-width:10px;display:grid;gap:12px;box-shadow:4px 4px 0 var(--line)}
.uh.m45{border-left-color:var(--c45)}
.uh.m90{border-left-color:var(--c90)}
.badge{justify-self:start;font-weight:700;font-size:14px;padding:3px 12px;color:#fff;border-radius:99px;background:var(--c45)}
.m90 .badge{background:var(--c90)}
:root[data-theme="dark"] .badge,:root[data-theme="dark"] .m90 .badge{color:#0c1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#0c1420}}
.lead{margin:0;max-width:65ch}
.merke{margin-top:18px;background:var(--soft);border-radius:12px;padding:16px 18px}
.merke h2{margin-bottom:8px}
.merke ul{margin:0;padding-left:20px;display:grid;gap:6px;max-width:70ch}
.tasks{display:grid;gap:16px;margin-top:20px}
.task{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:16px 18px;display:grid;gap:12px;scroll-margin-top:70px}
.task.done{border-color:var(--ok)}
.th{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.th b{font-family:var(--fd);font-size:24px;font-weight:800}
.q{margin:0;font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--soft);border-radius:8px;cursor:pointer}
.opt:has(input:checked){border-color:var(--line);background:var(--bg)}
.opt.good{border-color:var(--ok);background:var(--okbg)}
.opt input,.tfg input{accent-color:var(--accent);width:18px;height:18px;margin-top:3px}
.row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:9px 12px;border:2px solid var(--soft);border-radius:8px}
.row.bad{border-color:var(--bad);background:var(--badbg)}
.rt{flex:1 1 240px}
.tfg{display:flex;gap:14px}
.tfg label{display:flex;gap:6px;align-items:center;cursor:pointer}
select,.gap,textarea{border:2px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 10px;max-width:100%}
select{flex:0 1 300px;min-width:180px}
.cloze{margin:0;line-height:2.4}
.gap{width:150px;margin:0 4px;padding:4px 8px}
.gap.bad{border-color:var(--bad);background:var(--badbg)}
textarea{width:100%;resize:vertical;min-height:110px}
.count{font-size:14px;color:var(--muted)}
.fb{padding:9px 12px;border-radius:8px;font-weight:600}
.fb.good{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.muster{background:var(--soft);padding:12px 14px;border-radius:8px}
.muster p{margin:4px 0}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.check{margin-top:24px}
.check .chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:2px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 14px;cursor:pointer;font-weight:600}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin-top:10px}
th,td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--soft);white-space:nowrap}
th{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
td.t{white-space:normal}
#nachtext{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
details{border:2px solid var(--soft);border-radius:8px;padding:8px 12px;margin-top:8px}
summary{cursor:pointer;font-weight:600}
details p{margin:6px 0;white-space:pre-wrap}
.stack{display:grid;gap:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){body{font-size:16px}.big{font-size:38px}}
</style>
</head>
<body>
<nav><div class="wrap"><a href="#start">Sporttheorie 7</a><div class="r"><span id="navprog"></span><a class="pill" href="#nachweis">Nachweis</a></div></div></nav>
<main><div class="wrap" id="app"></div></main>
<script>
const U=[];
const MC=(q,right,wrong)=>({t:'mc',q,opts:[{x:right,ok:1},...wrong.map(x=>({x,ok:0}))]});
const TF=(q,rows)=>({t:'tf',q,rows});
const MA=(q,p)=>({t:'ma',q,p});
const FI=(q,text,ans)=>({t:'fi',q,text,ans});
const OP=(q,m,min)=>({t:'op',q,m,min:min||50});
const add=(id,min,title,intro,k,tasks)=>U.push({id,min,title,intro,k,tasks});

/* ================= 45 MINUTEN ================= */
add('a1',45,'Aufwärmen','Vor jeder Sportstunde wärmst du dich auf. Moderne Aufwärmprogramme sind aktiv, dynamisch und folgen einem klaren Aufbau.',[
"Aufwärmen dauert etwa 10 bis 15 Minuten und findet direkt vor der Belastung statt. Es soll spielerisch sein und Spass machen.",
"Wirkung: Puls, Atmung und Muskeltemperatur steigen, die Durchblutung nimmt zu, die Muskeln reagieren schneller. Das Verletzungsrisiko sinkt, die Leistung steigt.",
"Aufbau nach dem RAMP-Modell: R = Raise (Puls und Temperatur erhöhen, z. B. Traben, Seilspringen, Spiel), A = Activate (wichtige Muskeln aktivieren, z. B. Kniebeugen, Ausfallschritte, Rumpf), M = Mobilise (Gelenke dynamisch durch den ganzen Bewegungsraum bewegen, z. B. Hüft- und Armkreisen), P = Potentiate (auf schnelle, kräftige Bewegungen vorbereiten, z. B. Steigerungsläufe, kurze Sprünge, Aufschläge).",
"Aufwärmen ist aktiv. Heisse Dusche oder Massage ersetzen es nicht.",
"Langes statisches Dehnen (Position halten) direkt vor dem Sport schützt nicht besser vor Verletzungen und kann Kraft und Schnelligkeit kurz leicht senken. Besser: dynamisch bewegen. Statisch dehnt man eher am Ende der Stunde."
],[
MC("Warum wärmen wir uns auf?","Der Körper wird auf die Belastung vorbereitet, das Verletzungsrisiko sinkt und die Leistung steigt.",["Damit wir müde werden.","Damit die Muskeln grösser werden.","Damit die Lehrperson Zeit hat, die Anwesenheit zu notieren."]),
TF("Richtig oder falsch?",[["Beim Aufwärmen steigt der Puls.",1],["Aufwärmen dauert nur etwa eine Minute.",0],["Langes Dehnen im Stand ist die beste Vorbereitung auf Sport.",0],["Eine heisse Dusche ersetzt das aktive Aufwärmen.",0],["Beim Aufwärmen bewegt man sich aktiv und dynamisch.",1]]),
MA("Ordne jede Übung der RAMP-Phase zu.",[["Locker traben oder Seilspringen","Raise: Puls und Temperatur erhöhen"],["Kniebeugen und Ausfallschritte","Activate: Wichtige Muskeln aktivieren"],["Hüft- und Armkreisen","Mobilise: Gelenke beweglich machen"],["Steigerungsläufe und kurze Sprünge","Potentiate: Auf schnelle, kräftige Bewegungen vorbereiten"]]),
FI("Ergänze das RAMP-Modell.","Raise, Activate, Mobilise und ___.",[["Potentiate","Potenzieren","Potentiation","Potenzierung"]]),
OP("Schreibe ein Mini-Aufwärmprogramm nach RAMP für deine Lieblingssportart: je eine Übung für R, A, M und P, mit einem Satz zum Zweck.","Beispiel Volleyball: R: 3 Minuten Traben und Seilspringen (Puls erhöhen). A: Kniebeugen und Unterarmstütz (Beine und Rumpf aktivieren). M: Schulter- und Hüftkreisen (Gelenke beweglich machen). P: 2 Steigerungsläufe und ein paar Aufschläge (auf schnelle Bewegungen vorbereiten).",80)
]);

add('a2',45,'Herz, Kreislauf und Puls','Dein Herz arbeitet ohne Pause. Beim Sport siehst du, wie es sich anpasst: Du kannst es am Puls messen.',[
"Das Herz ist ein Hohlmuskel, etwa so gross wie deine Faust. Es hat zwei Vorhöfe und zwei Kammern.",
"Das Blut bringt Sauerstoff und Nährstoffe zu den Muskeln und transportiert Abfallstoffe ab.",
"Lungenkreislauf: Das Blut nimmt in der Lunge Sauerstoff auf. Körperkreislauf: Das Blut versorgt Organe und Muskeln.",
"Puls = Anzahl Herzschläge pro Minute. Der Ruhepuls liegt bei Jugendlichen meist bei 60 bis 80.",
"Messen: Zeige- und Mittelfinger an Handgelenk (Daumenseite) oder Hals, 15 Sekunden zählen und mal 4 rechnen.",
"Maximalpuls schätzen: Tanaka-Formel 208 minus 0,7 mal Alter. Die ältere Faustregel 220 minus Alter ist ungenauer. Jede Formel ist nur ein Richtwert, bei einzelnen Personen weicht der Wert um etwa 10 Schläge ab."
],[
MC("Was misst der Puls?","Die Anzahl Herzschläge pro Minute.",["Die Menge Blut im Körper.","Den Sauerstoff in der Lunge.","Wie schnell du rennen kannst."]),
FI("Du zählst in 15 Sekunden 20 Herzschläge. Rechne um.","Dein Puls beträgt ___ Schläge pro Minute.",[["80"]]),
FI("Schätze den Maximalpuls einer 13-Jährigen mit der Tanaka-Formel (208 minus 0,7 mal Alter). Runde auf eine ganze Zahl.","208 − 0,7 × 13 = ___",[["199","198.9","198,9"]]),
TF("Richtig oder falsch?",[["Beim Sport steigt der Puls.",1],["Das Herz hat drei Kammern.",0],["Das Blut transportiert Sauerstoff zu den Muskeln.",1],["Regelmässiges Ausdauertraining senkt meist den Ruhepuls.",1]]),
OP("Warum schlägt dein Herz beim Rennen schneller? Erkläre in 2 bis 3 Sätzen.","Beim Rennen brauchen die Muskeln mehr Sauerstoff und Nährstoffe. Das Herz pumpt schneller und mehr Blut durch den Körper, damit diese Stoffe rascher bei den Muskeln ankommen und Abfallstoffe abtransportiert werden.",50)
]);

add('a3',45,'Muskeln','Ohne Muskeln keine Bewegung. Hier lernst du, wie sie arbeiten und warum sie immer im Team funktionieren.',[
"Muskeln können sich nur verkürzen (ziehen). Sie können nicht stossen.",
"Darum arbeiten sie als Gegenspieler: Beuger und Strecker.",
"Der Bizeps beugt den Ellbogen, der Trizeps streckt ihn.",
"Sehnen verbinden Muskeln mit Knochen. Bänder verbinden Knochen mit Knochen.",
"Dynamische Arbeit: Es gibt Bewegung (Kniebeuge). Statische Arbeit: Die Position wird gehalten (Plank)."
],[
MC("Wie bewegt ein Muskel einen Knochen?","Er verkürzt sich und zieht.",["Er stösst den Knochen weg.","Er wird länger und drückt.","Er bewegt sich nicht, nur die Sehne arbeitet."]),
MA("Ordne zu.",[["Bizeps","Beugt den Ellbogen"],["Trizeps","Streckt den Ellbogen"],["Sehne","Verbindet Muskel und Knochen"],["Band","Verbindet Knochen mit Knochen"]]),
TF("Richtig oder falsch?",[["Der Bizeps ist der Gegenspieler des Trizeps.",1],["Bei einer Plank arbeiten die Muskeln statisch.",1],["Muskeln können aktiv stossen.",0],["Sehnen verbinden zwei Knochen miteinander.",0]]),
FI("Ergänze.","Muskeln können nur ziehen. Darum arbeitet jeder Muskel mit einem ___ zusammen.",[["Gegenspieler","Gegner","Antagonist"]]),
OP("Nenne drei Muskelgruppen und je eine Übung, die sie trainiert.","Bauchmuskeln: Plank oder Sit-up. Oberschenkelvorderseite (Quadrizeps): Kniebeuge. Brust und Trizeps: Liegestütz.",60)
]);

add('a4',45,'Die fünf motorischen Fähigkeiten','Jede Sportart verlangt etwas anderes von dir. Fünf Fähigkeiten helfen dir, das zu beschreiben.',[
"Kraft: einen Widerstand überwinden (Liegestütz, Kugelstossen).",
"Ausdauer: lange durchhalten, ohne stark zu ermüden (20 Minuten Laufen).",
"Schnelligkeit: schnell reagieren und sich schnell bewegen (Sprint).",
"Beweglichkeit: grosse Gelenkbewegungen ausführen (Spagat).",
"Koordination: Bewegungen genau und flüssig abstimmen, Gleichgewicht halten (Jonglieren, Balancieren)."
],[
MA("Welche Fähigkeit steht im Vordergrund?",[["Marathon","Ausdauer"],["100-Meter-Sprint","Schnelligkeit"],["Kugelstossen","Kraft"],["Spagat","Beweglichkeit"],["Jonglieren","Koordination"]]),
MC("Welche Fähigkeit ist beim Balancieren auf der Langbank besonders wichtig?","Koordination (Gleichgewicht)",["Maximalkraft","Ausdauer","Schnelligkeit"]),
TF("Richtig oder falsch?",[["Ausdauer bedeutet, lange durchzuhalten.",1],["Ein Sprint trainiert vor allem die Schnelligkeit.",1],["Kraft kann man nicht trainieren.",0],["Beweglichkeit wird durch regelmässiges Dehnen verbessert.",1]]),
FI("Ergänze.","Kraft, Ausdauer, Schnelligkeit, Beweglichkeit und ___ sind die fünf Fähigkeiten.",[["Koordination","Koordinationsfähigkeit"]]),
OP("Wähle eine Sportart. Welche zwei Fähigkeiten sind dort am wichtigsten? Begründe.","Beispiel Volleyball: Schnelligkeit (schnell zum Ball reagieren) und Kraft (Sprungkraft für Angriff und Block). Auch die Koordination ist wichtig, weil der Ball genau getroffen werden muss.",60)
]);

add('a5',45,'Ernährung und Trinken','Was du isst und trinkst, ist dein Treibstoff. Gerade beim Sport macht das einen Unterschied.',[
"Die Schweizer Ernährungsempfehlungen wurden 2024 überarbeitet. Die Basis der Pyramide sind 1 bis 2 Liter ungezuckerte Getränke pro Tag, am besten Wasser.",
"Täglich 5 Portionen Früchte und Gemüse, davon 3 Gemüse und 2 Früchte. Eine Portion entspricht etwa einer Handvoll (120 Gramm).",
"Darüber folgen Getreideprodukte und Kartoffeln (Vollkorn bevorzugen), Milchprodukte und Proteinquellen wie Hülsenfrüchte, Tofu, Eier, Fisch und Fleisch (pflanzliche Quellen bevorzugen), dann Nüsse und Öle. Süssgetränke, Süsses und salzige Snacks nur in kleinen Mengen.",
"Kohlenhydrate (Brot, Pasta, Reis) sind der wichtigste Treibstoff.",
"Eiweiss baut Muskeln und Gewebe auf. Fette sind Energiespeicher.",
"Beim Sport trinkt man Wasser oder ungesüssten Tee. Energydrinks gehören zu den Extras ganz oben in der Pyramide und sind für Jugendliche ungeeignet.",
"Nach der Belastung helfen Kohlenhydrate und etwas Eiweiss bei der Erholung."
],[
MC("Was ist das beste Getränk beim Sport?","Wasser oder ungesüsster Tee",["Energydrink","Cola","Grosse Mengen Süssgetränk"]),
MA("Ordne zu.",[["Kohlenhydrate","Wichtigster Energielieferant"],["Eiweiss","Baustoff für Muskeln"],["Fette","Energiespeicher"],["Wasser","Transport und Kühlung im Körper"]]),
TF("Richtig oder falsch?",[["Empfohlen sind 5 Portionen Gemüse und Früchte pro Tag.",1],["Süssigkeiten bilden die Basis der Lebensmittelpyramide.",0],["Energydrinks sind für Jugendliche ein guter Durstlöscher.",0],["Man sollte täglich 1 bis 2 Liter trinken.",1]]),
FI("Ergänze.","Der wichtigste Treibstoff für die Muskeln sind die ___.",[["Kohlenhydrate","Kohlehydrate"]]),
OP("Du hast um 17 Uhr Training. Was isst und trinkst du am Mittag und kurz vorher? Begründe kurz.","Mittags eine Mahlzeit mit Kohlenhydraten (z. B. Pasta oder Reis) mit Gemüse und etwas Eiweiss. Vor dem Training einen kleinen Snack (Banane, Brot) und Wasser. Grund: Die Muskeln brauchen Energie, aber ein voller Magen stört beim Bewegen.",60)
]);

add('a6',45,'Verletzungen und Erste Hilfe','Verletzungen passieren. Entscheidend ist, dass du weisst, was zu tun ist. Der Ratschlag hat sich in den letzten Jahren geändert.',[
"Häufige Sportverletzungen: Verstauchung (Bänder am Gelenk), Zerrung (Muskel), Prellung, Schürfwunde.",
"Früher galt die PECH-Regel (Pause, Eis, Compression, Hochlagern). Sie gilt heute als veraltet, weil zu lange Ruhe die Heilung verlangsamen kann.",
"Heute: PEACE für die ersten 1 bis 3 Tage. P = Protect (schonen, nicht belasten), E = Elevate (hochlagern), A = Avoid anti-inflammatories (keine entzündungshemmenden Mittel ohne Absprache mit Arzt oder Ärztin), C = Compress (leichter Druck mit Verband), E = Educate (informieren und selbst aktiv an der Heilung mitwirken).",
"Danach LOVE: L = Load (wieder belasten, soweit es schmerzfrei geht), O = Optimism (zuversichtlich bleiben), V = Vascularisation (Ausdauerbewegung ohne Schmerzen, die den Blutfluss anregt), E = Exercise (gezielte Übungen für Beweglichkeit, Kraft und Gleichgewicht).",
"Notrufe in der Schweiz: 144 Sanität, 117 Polizei, 118 Feuerwehr, 1414 Rega, 112 europäischer Notruf.",
"Zum Arzt geht man bei starken Schmerzen, deutlicher Schwellung, Fehlstellung oder wenn man nicht mehr auftreten kann. Bei jeder Verletzung zuerst die Lehrperson informieren."
],[

add('b5',90,'Trainingsplanung und Prinzipien','Wer besser werden will, trainiert nicht einfach drauflos. Mit Prinzipien und einem Plan geht es gezielter.',[

"Dauermethode: lange, gleichmässig. Intervallmethode: Belastung und Pause im Wechsel. Fahrtspiel: Tempo wechselt frei.",

const KEY='sporttheorie-7-verletzt-v1';

const norm=s=>String(s).toLowerCase().trim().replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/[.,;:!?"'()]/g,'').replace(/\s+/g,' ');
function rng(seed){let h=2166136261;for(const c of seed){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
const unitById=id=>U.find(u=>u.id===id);
const num=u=>U.filter(x=>x.min===u.min).indexOf(u)+1;

function total(){let d=0,n=0,r=0,full=0;U.forEach(u=>{const s=stat(u);d+=s.d;n+=s.n;r+=s.r;if(s.full)full++});return{d,n,r,full}}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function openTasks(u){const o=[];u.tasks.forEach((_,i)=>{const s=S.t[u.id+'-'+i];if(!(s&&s.d))o.push(i)});return o}

function taskHTML(u,i){

  body=shuffle(t.opts,key).map((o,k)=>`<label class="opt${done&&o.ok?' good':''}"><input type="radio" name="r-${key}" value="${k}"${(done?o.ok:a===k)?' checked':''}${dis}><span>${esc(o.x)}</span></label>`).join('');
 }else if(t.t==='tf'){
  body=t.rows.map((r,k)=>{const v=done?(r[1]?'T':'F'):(a&&a[k]);

 }else if(t.t==='ma'){

 }else if(t.t==='fi'){
  const parts=t.text.split('___');
  body='<p class="cloze">'+parts.map((s,k)=>esc(s)+(k<parts.length-1?`<input type="text" class="gap${bad(k)?' bad':''}" data-k="${k}" aria-label="Lücke ${k+1}" value="${esc(done?t.ans[k][0]:((a&&a[k])||''))}" autocomplete="off" autocapitalize="off" spellcheck="false"${dis}>`:'')).join('')+'</p>';
 }else{

  body=`<textarea rows="5" data-op placeholder="Schreibe hier deine Antwort …" aria-label="Antwort"${dis}>${esc(txt)}</textarea>`+

 }
 let foot='';
 if(done)foot=`<div class="fb good">✓ Gelöst${rev?' (Lösung wurde angezeigt)':''}</div>`;

}

function nachView(){
 const T=total();
 const rows=U.map(u=>{const x=stat(u);return `<tr><td>${code(u)}</td><td class="t">${esc(u.title)}</td><td>${x.d} / ${x.n}</td><td>${x.r||'–'}</td><td>${x.full?'<span class="tag done">Fertig</span>':'<span class="tag">Offen</span>'}</td></tr>`}).join('');
 const miss=U.filter(u=>!stat(u).full).map(u=>`<li><a href="#einheit-${u.id}">${code(u)} ${esc(u.title)}</a>: Aufgabe ${openTasks(u).map(i=>i+1).join(', ')}</li>`).join('');
 const opens=[];U.forEach(u=>u.tasks.forEach((t,i)=>{const s=S.t[u.id+'-'+i];if(t.t==='op'&&s&&s.d&&s.a)opens.push(`<details><summary>${code(u)} ${esc(u.title)} · Aufgabe ${i+1}</summary><p><b>${esc(t.q)}</b></p><p>${esc(s.a)}</p></details>`)}));
 return `<a class="back" href="#start">← Alle Einheiten</a>
 <div class="stack"><header><div class="eyebrow">Zum Zeigen an die Lehrperson</div><h1>Nachweis</h1></header>
 <div class="panel stack"><div class="nameline"><label for="nm"><b>Name</b></label><input id="nm" type="text" value="${esc(S.name||'')}" placeholder="Vorname Nachname" autocomplete="name"></div>
 <div class="sum"><div><div class="big">${T.d}<small> / ${T.n}</small></div><div>Aufgaben gelöst · ${T.full} von ${U.length} Einheiten komplett${T.r?' · '+T.r+' mit angezeigter Lösung':''}</div></div><div><b>${new Date().toLocaleDateString('de-CH')}</b></div></div>
 <div class="bar"><i style="width:${pct(T.d,T.n)}%"></i></div>
 ${T.full===U.length?'<div class="fb good">✓ Alles gelöst. Alle 20 Einheiten sind abgeschlossen.</div>':`<div><b>Das fehlt noch:</b><ul>${miss}</ul></div>`}</div>
 <div class="panel"><h2>Übersicht</h2><div class="tw"><table><thead><tr><th>Nr.</th><th>Einheit</th><th>Gelöst</th><th>Mit Lösung</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
 <div class="panel stack"><h2>Text für die Lehrperson</h2><textarea id="nachtext" readonly>${esc(nachText())}</textarea><div class="acts"><button class="btn" data-act="copy">Text kopieren</button><span id="copymsg" class="count"></span></div></div>
 <div class="panel"><h2>Offene Antworten</h2>${opens.length?opens.join(''):'<p>Noch keine offenen Aufgaben abgegeben.</p>'}</div>
 <div class="panel"><h2>Zurücksetzen</h2><p>Löscht alle Antworten auf diesem Gerät. Das lässt sich nicht rückgängig machen.</p><div class="acts" id="resetbox"><button class="btn ghost" data-act="reset1">Alles zurücksetzen</button></div></div></div>`;
}
function updNav(){const T=total();const e=document.getElementById('navprog');if(e)e.textContent=T.d+' / '+T.n}
function route(){
 const h=location.hash.slice(1);let u;
 if(h.startsWith('einheit-')&&(u=unitById(h.slice(8)))){app.innerHTML=unitView(u);document.title=u.title+' · Sporttheorie 7. Klasse'}
 else if(h==='nachweis'){app.innerHTML=nachView();document.title='Nachweis · Sporttheorie 7. Klasse'}
 else{app.innerHTML=homeView();document.title='Sporttheorie 7. Klasse'}
 updNav();window.scrollTo(0,0);
}
function redraw(uid,i){
 const u=unitById(uid),el=document.getElementById('t-'+uid+'-'+i);if(!el)return;
 el.outerHTML=taskHTML(u,i);
 const p=document.getElementById('unitprog'),c=document.getElementById('unitcheck');
 if(p)p.innerHTML=progHTML(stat(u));if(c)c.innerHTML=checkHTML(u);updNav();
}
function readAnswer(el,t){
 if(t.t==='mc'){const c=el.querySelector('input:checked');return c?+c.value:null}
 if(t.t==='tf')return t.rows.map((_,k)=>{const c=el.querySelector(`input[name$="-${k}"]:checked`);return c?c.value:null});
 if(t.t==='ma')return t.p.map((_,k)=>el.querySelector(`select[data-k="${k}"]`).value);
 if(t.t==='fi')return t.ans.map((_,k)=>el.querySelector(`.gap[data-k="${k}"]`).value);
 return el.querySelector('textarea').value.trim();
}
function check(uid,i){
 const u=unitById(uid),t=u.tasks[i],key=uid+'-'+i,el=document.getElementById('t-'+key);
 const st=S.t[key]=S.t[key]||{};const a=readAnswer(el,t);
 if(t.t==='op'){
  if(a.length<t.min){st.a=a;MSG[key]=`Schreibe etwas mehr. Mindestens ${t.min} Zeichen, du hast ${a.length}.`;save();return redraw(uid,i)}
  st.a=a;st.d=1;MSG[key]='';save();return redraw(uid,i);
 }
 const empty=t.t==='mc'?a===null:a.some(x=>x===null||x==='');
 if(empty){st.a=a;MSG[key]=t.t==='mc'?'Wähle zuerst eine Antwort.':'Beantworte zuerst alle Teile.';save();return redraw(uid,i)}
 let ok,bad=[];
 if(t.t==='mc')ok=!!shuffle(t.opts,key)[a].ok;
 else if(t.t==='tf'){t.rows.forEach((r,k)=>{if((a[k]==='T')!==!!r[1])bad.push(k)});ok=!bad.length}
 else if(t.t==='ma'){t.p.forEach((p,k)=>{if(a[k]!==p[1])bad.push(k)});ok=!bad.length}
 else{t.ans.forEach((acc,k)=>{if(!acc.map(norm).includes(norm(a[k])))bad.push(k)});ok=!bad.length}
 st.a=a;
 if(ok){st.d=1;st.bad=[];MSG[key]=''}
 else{st.n=(st.n||0)+1;st.bad=bad;MSG[key]=t.t==='mc'?'Noch nicht richtig. Lies den Kasten «Merke dir» nochmals.':`Noch nicht ganz richtig. ${bad.length} Teil${bad.length>1?'e sind':' ist'} rot markiert.`}
 save();redraw(uid,i);
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act;
 if(a==='check')check(b.dataset.u,+b.dataset.i);
 else if(a==='reveal'){const key=b.dataset.u+'-'+b.dataset.i,st=S.t[key]=S.t[key]||{};st.d=1;st.r=1;MSG[key]='';save();redraw(b.dataset.u,+b.dataset.i)}
 else if(a==='jump'){const el=document.getElementById('t-'+b.dataset.key);if(el){el.scrollIntoView({behavior:'smooth',block:'start'})}}
 else if(a==='copy'){const ta=document.getElementById('nachtext'),m=document.getElementById('copymsg');
  const fb=()=>{ta.focus();ta.select();m.textContent='Text markiert. Jetzt kopieren (lange drücken oder Strg+C).'};
  try{navigator.clipboard.writeText(ta.value).then(()=>{m.textContent='Kopiert.'},fb)}catch(err){fb()}}
 else if(a==='reset1'){document.getElementById('resetbox').innerHTML='<b>Wirklich alles löschen?</b><button class="btn" data-act="reset2">Ja, löschen</button><button class="btn ghost" data-act="reset0">Abbrechen</button>'}
 else if(a==='reset0'){document.getElementById('resetbox').innerHTML='<button class="btn ghost" data-act="reset1">Alles zurücksetzen</button>'}
 else if(a==='reset2'){const n=S.name;S={name:n,t:{}};for(const k in MSG)delete MSG[k];save();route()}
});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='nm'){S.name=t.value;save();const x=document.getElementById('nachtext');if(x)x.value=nachText()}
 else if(t.matches('textarea[data-op]')){
  const art=t.closest('.task'),key=art.id.slice(2),m=key.match(/^(.+)-(\d+)$/),u=unitById(m[1]),task=u.tasks[+m[2]];
  const st=S.t[key]=S.t[key]||{};st.a=t.value;save();
  const c=art.querySelector('[data-count]');if(c)c.textContent=`${t.value.trim().length} von mindestens ${task.min} Zeichen`;
 }
});
window.addEventListener('hashchange',route);
route();
</script></body></html>
